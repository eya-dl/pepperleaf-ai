name: PepperLeaf CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install API dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
            - name: Check Docker Hub username secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Username length: ${#DOCKERHUB_USERNAME}"
          echo "Token is set: ${DOCKERHUB_TOKEN:+yes}"
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pepperleaf-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pepperleaf-api:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pepperleaf-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pepperleaf-frontend:${{ github.sha }}